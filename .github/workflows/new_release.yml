name: Release-temp

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

# https://github.com/PRO-2684/castwright/blob/main/.github/workflows/release.yml

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - os: ubuntu-latest
          target: linux-x86_64
          ext: ""
        - os: macos-latest
          target: macos-aarch64
          ext: ""
        - os: windows-latest
          target: windows-x86_64
          ext: ".exe"
        binary:
        - mtorrent-cli
        - dht_node
    runs-on: ${{ matrix.platform.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build executables
      run: cargo build --release --bin ${{ matrix.binary }}
    - name: Rename binary
      shell: bash
      run: mv target/release/${{ matrix.binary }}${{ matrix.platform.ext }} target/release/${{ matrix.binary }}-${{ matrix.platform.target }}${{ matrix.platform.ext }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.platform.os }}
        path: |
          target/release/${{ matrix.binary }}-${{ matrix.platform.target }}${{ matrix.platform.ext }}

  create-release:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: artifacts/*
        draft: true

